spring.application.name=AI Cloud Vendor Recommendation System
server.port=${PORT:8080}

# MySQL: Railway injects these variables for services in the same project.
# Local development falls back to localhost and DB_PASSWORD.

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:cloud_recommendation_db}?sslMode=${MYSQL_SSL_MODE:DISABLED}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
